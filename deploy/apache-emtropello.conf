# EMTropello — proxy invers a uvicorn (127.0.0.1:8791), NOMÉS xarxa local.
# Instal·lar a: /etc/apache2/conf-available/emtropello.conf
#   sudo a2enconf emtropello && sudo systemctl reload apache2
# Accés: http://<ip-lan>/emtropello/

<Location /emtropello>
    Require ip 192.168.1.0/24 127.0.0.1 ::1
</Location>

ProxyPreserveHost On
ProxyPass        /emtropello/ http://127.0.0.1:8791/
ProxyPassReverse /emtropello/ http://127.0.0.1:8791/

# afegeix la barra final si falta
RedirectMatch permanent ^/emtropello$ /emtropello/
