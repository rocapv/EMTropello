# EMTropello — proxy invers a uvicorn (127.0.0.1:8791).
# Instal·lar a: /etc/apache2/conf-available/emtropello.conf
#   sudo a2enconf emtropello && sudo systemctl reload apache2
#
# Accés (mateixes normes que Metroviolencia):
#   - LAN (ports normals 80/443): lliure, sense token.
#   - Ports externs ja reenviats 5580 (HTTP) i 8751 (HTTPS, cert home.pr1.es):
#     oberts; el TOKEN l'exigeix el middleware de FastAPI (fora de la LAN → 403
#     sense token). Els ports 5580/8751 i el vhost SSL 8751 els declara la conf de
#     Metroviolencia (compartits); ací NOMÉS afegim la regla d'accés + el proxy.
<Location /EMT>
    <If "%{SERVER_PORT} -in { '5580', '8751' }">
        Require all granted
    </If>
    <Else>
        Require ip 192.168.1.0/24 127.0.0.1 ::1
    </Else>
</Location>

ProxyPreserveHost On
ProxyPass        /EMT/ http://127.0.0.1:8791/
ProxyPassReverse /EMT/ http://127.0.0.1:8791/

# afegeix la barra final si falta
RedirectMatch permanent ^/EMT$ /EMT/
