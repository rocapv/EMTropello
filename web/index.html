<!doctype html>
<html lang="ca-ES-valencia">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>
<body>

        <span class="dot-live"></span><span class="marca">EMT<span class="viol">ROPELLO</span></span>

      <div class="ley-tit">Línies <span id="ley-count"></span></div>
      <div id="leyenda"></div>
    </div>
  </header>

  <div id="reloj"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
